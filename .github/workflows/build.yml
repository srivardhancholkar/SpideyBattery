name: Build SpideyBattery
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          # iOS SDK for Theos
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks-tmp"
          cp -a "$THEOS/sdks-tmp/iPhoneOS16.5.sdk" "$THEOS/sdks/" 2>/dev/null || \
            cp -a "$THEOS"/sdks-tmp/iPhoneOS*.sdk "$THEOS/sdks/"
          rm -rf "$THEOS/sdks-tmp"

      - name: Build package
        run: |
          export THEOS=${{ github.workspace }}/theos
          make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: SpideyBattery-deb
          path: packages/*.deb
          if-no-files-found: error
